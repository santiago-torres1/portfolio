name: CI

on:
  pull_request:
  workflow_call: # run by cd.yml as the gate before deploying

permissions:
  contents: read

concurrency:
  # New pushes to a PR cancel its older runs; calls from CD never cancel.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.1

jobs:
  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  image:
    name: Image · hadolint, build, smoke test
    # Same architecture as the Lambda function (arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: web/Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Shared runner IPs sometimes hit public registry rate limits (429) when
      # pulling base images, so a failed build is retried once after a pause.
      - name: Build image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: &build
          context: web
          load: true
          tags: portfolio:ci
          provenance: false
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,scope=web-arm64,mode=max

      - name: Wait before retrying build
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: *build

      - name: Smoke test container
        run: |
          docker run -d --name site -p 3000:3000 portfolio:ci
          for path in / /blog /blog/hello-world; do
            curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null \
              -w "$path %{http_code}\n" "http://localhost:3000$path"
          done

      - name: Container logs
        if: failure()
        run: docker logs site

  terraform:
    name: Terraform · fmt, validate, tflint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for stack in bootstrap app; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when fetching the AWS ruleset
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  plan:
    name: Terraform · plan (app)
    needs: terraform
    # Needs the bootstrap stack + repo variables (see README). Fork PRs get no
    # OIDC token, so they skip this job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_domain_names: ${{ vars.DOMAIN_NAMES }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
    defaults:
      run:
        working-directory: infra/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=app/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=2m -out=tfplan
          {
            echo "### Terraform plan (infra/app)"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
